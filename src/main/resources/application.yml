spring:
  application:
    name: research-connect
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0

server:
  port: ${PORT:8080}

researchconnect:
  firebase:
    web-api-key: ${FIREBASE_WEB_API_KEY:}
    web-auth-domain: ${FIREBASE_WEB_AUTH_DOMAIN:}
    web-project-id: ${FIREBASE_PROJECT_ID:}
    web-app-id: ${FIREBASE_WEB_APP_ID:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
