<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ResearchConnect</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<main class="auth-layout">
    <section class="auth-intro">
        <p class="eyebrow">THAPAR INSTITUTE OF ENGINEERING AND TECHNOLOGY</p>
        <h1>ResearchConnect</h1>
        <p class="lead">Find meaningful research opportunities. Build teams around ideas that matter.</p>
    </section>
    <section class="auth-panel">
        <p class="eyebrow">UNIVERSITY RESEARCH NETWORK</p>
        <h2>Sign in to continue</h2>
        <p class="muted">Access is limited to verified thapar.edu Google accounts.</p>
        <button id="google-sign-in" class="button button-dark" type="button">Continue with Google</button>
        <p id="auth-error" class="form-error" aria-live="polite"></p>
    </section>
</main>
<script th:inline="javascript">
    window.firebaseConfig = {
        apiKey: /*[[${firebaseApiKey}]]*/ "",
        authDomain: /*[[${firebaseAuthDomain}]]*/ "",
        projectId: /*[[${firebaseProjectId}]]*/ "",
        appId: /*[[${firebaseAppId}]]*/ ""
    };
</script>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
